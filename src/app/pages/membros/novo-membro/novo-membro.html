<div class="novo-membro-container">
  <div class="page-header">
    <h2>Novo Membro</h2>

    <p>Cadastre um novo membro da Legião de Maria.</p>
  </div>

  <!-- STEPPER -->

  <div class="stepper">
    <div class="step" [class.active]="etapa >= 1">
      <div class="step-circle">1</div>

      <span>Dados Pessoais</span>
    </div>

    <div class="step-line"></div>

    <div class="step" [class.active]="etapa >= 2">
      <div class="step-circle">2</div>

      <span>Dados Legionários</span>
    </div>

    <div class="step-line"></div>

    <div class="step" [class.active]="etapa >= 3">
      <div class="step-circle">3</div>

      <span>Estrutura</span>
    </div>
  </div>

  <div class="form-card">
    <!-- ETAPA 1 -->

    @if (etapa === 1) {
      <div class="form-grid">
        <div class="full-width">
          <label>Nome Completo</label>
          <input type="text" class="form-control" />
        </div>

        <div>
          <label>CPF</label>
          <input type="text" class="form-control" />
        </div>

        <div>
          <label>RG</label>
          <input type="text" class="form-control" />
        </div>

        <div>
          <label>Data de Nascimento</label>
          <input type="date" class="form-control" />
        </div>

        <div>
          <label>Sexo</label>
          <select class="form-select">
            <option>Selecione</option>
          </select>
        </div>

        <div>
          <label>Telefone</label>
          <input type="text" class="form-control" />
        </div>

        <div>
          <label>Celular</label>
          <input type="text" class="form-control" />
        </div>

        <div class="full-width">
          <label>E-mail</label>
          <input type="email" class="form-control" />
        </div>
      </div>
    }

    <!-- ETAPA 2 -->

    @if (etapa === 2) {
      <div class="form-grid">
        <div>
          <label>Data de Ingresso</label>
          <input type="date" class="form-control" />
        </div>

        <div>
          <label>Tipo de Membro</label>

          <select class="form-select">
            <option>Ativo</option>
            <option>Auxiliar</option>
          </select>
        </div>

        <div>
          <label>Cargo</label>

          <select class="form-select">
            <option>Selecione</option>
          </select>
        </div>

        <div>
          <label>Status</label>

          <select class="form-select">
            <option>Ativo</option>
            <option>Inativo</option>
          </select>
        </div>

        <div>
          <label>Promessa Legionária</label>

          <select class="form-select">
            <option>Sim</option>
            <option>Não</option>
          </select>
        </div>

        <div>
          <label>Data da Promessa</label>

          <input type="date" class="form-control" />
        </div>
      </div>
    }

    <!-- ETAPA 3 -->

    @if (etapa === 3) {
      <div class="form-grid">
        <div>
          <label>Comitium</label>

          <select class="form-select">
            <option>Selecione</option>
          </select>
        </div>

        <div>
          <label>Cúria</label>

          <select class="form-select">
            <option>Selecione</option>
          </select>
        </div>

        <div>
          <label>Praesidium</label>

          <select class="form-select">
            <option>Selecione</option>
          </select>
        </div>

        <div>
          <label>Função</label>

          <select class="form-select">
            <option>Selecione</option>
          </select>
        </div>
      </div>
    }

    <div class="form-actions">
      <button class="btn btn-outline-secondary" (click)="voltar()" [disabled]="etapa === 1">
        Anterior
      </button>

      @if (etapa < 3) {
        <button class="btn btn-primary" (click)="proximo()">Próximo</button>
      }

      @if (etapa === 3) {
        <button class="btn btn-success">Salvar Membro</button>
      }
    </div>
  </div>
</div>

<div class="membros-container">
  <div class="page-header">
    <div>
      <h2>Membros</h2>

      <p>Gerencie e acompanhe os membros da Legião de Maria.</p>
    </div>

    <button class="btn btn-primary" (click)="novoMembro()">
      <i class="bi bi-plus-circle"></i>
      Novo Membro
    </button>
  </div>

  <!-- Filtros -->

  <div class="filter-card">
    <div class="card-title">Filtros</div>

    <div class="filters-grid">
      <div>
        <label>Comitium</label>

        <select class="form-select">
          <option>Todos</option>
        </select>
      </div>

      <div>
        <label>Cúria</label>

        <select class="form-select">
          <option>Todas</option>
        </select>
      </div>

      <div>
        <label>Praesidium</label>

        <select class="form-select">
          <option>Todos</option>
        </select>
      </div>

      <div>
        <label>Cargo</label>

        <select class="form-select">
          <option>Todos</option>
        </select>
      </div>

      <div>
        <label>Status</label>

        <select class="form-select">
          <option>Todos</option>
          <option>Ativo</option>
          <option>Inativo</option>
        </select>
      </div>
    </div>

    <div class="filter-actions">
      <button class="btn btn-primary">Filtrar</button>

      <button class="btn btn-outline-secondary">Limpar</button>
    </div>
  </div>

  <!-- Tabela -->

  <div class="table-card">
    <div class="card-title">Lista de Membros</div>

    <table class="table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Cargo</th>
          <th>Praesidium</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>
        @for (membro of membros; track membro.id) {
          <tr>
            <td>{{ membro.nome }}</td>

            <td>{{ membro.cargo }}</td>

            <td>{{ membro.presidium }}</td>

            <td>
              <span class="status-badge">
                {{ membro.status }}
              </span>
            </td>

            <td>
              <button class="btn btn-sm btn-light me-2">
                <i class="bi bi-pencil"></i>
              </button>

              <button class="btn btn-sm btn-danger">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
